name: Build and syntax checks
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --check server/db.mjs
      - run: node --check server/seed.mjs
      - run: node --check server/index.mjs
      - run: npm run build
      - run: npm test
